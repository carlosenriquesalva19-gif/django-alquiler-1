{% extends "base.html" %}

{% block title %}Borrar categoría{% endblock %}

{% block content %}
    <div class="card">
        <h2 style="margin-top: 0">Borrar categoría</h2>
        <p>¿Seguro que quieres borrar <b>{{ object.nombre }}</b>?</p>

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next_url|default:'' }}" />
            <button class="btn danger" type="submit">Desactivar</button>
            {% if next_url %}
                <a class="btn secondary" href="{{ next_url }}" style="margin-left: 8px">Cancelar</a>
            {% else %}
                <a class="btn secondary" href="{% url 'tienda:categoria_list' %}" style="margin-left: 8px">Cancelar</a>
            {% endif %}
        </form>
    </div>
{% endblock %}
