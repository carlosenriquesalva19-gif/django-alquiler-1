{% extends "base.html" %}

{% block title %}Importar clientes{% endblock %}

{% block content %}
    <div class="card">
        <h2 style="margin-top: 0">Importar clientes desde CSV</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {{ form.as_p }}
            <button class="btn" type="submit">Importar</button>
            <a class="btn secondary" href="{% url 'tienda:cliente_list' %}" style="margin-left: 8px">Cancelar</a>
        </form>
    </div>
{% endblock %}
